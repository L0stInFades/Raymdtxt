<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Provide a minimal `process` global for Node.js polyfills (util, stream, etc.)
      // that run in the browser context. Electron's preload cannot expose `process`
      // because contextIsolation is enabled and nodeIntegration is off.
      if (typeof process === 'undefined') {
        window.process = { env: {}, browser: true, version: 'v22.0.0', versions: {}, platform: 'browser', nextTick: (fn) => { Promise.resolve().then(fn) } }
      } else if (!process.env) {
        process.env = {}
      }
    </script>
    <meta charset="utf-8">
    <link rel="icon" href="./assets/images/logo.png">
    <title>Vien</title>
    <style>
      :root {
        --loading-bg: rgb(248, 244, 238);
        --loading-mark: rgba(56, 48, 39, 0.62);
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        overflow: hidden;
      }

      #loading-page {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--loading-bg);
        -webkit-app-region: drag;
        opacity: 1;
        transition: opacity 90ms ease-out;
      }

      #loading-page.is-leaving {
        opacity: 0;
      }

      .loading-stage {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        letter-spacing: 0.08em;
      }

      .loading-logo {
        width: 24px;
        height: 24px;
        border-radius: 8px;
      }

      .loading-wordmark {
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        color: var(--loading-mark);
      }

      @media (prefers-reduced-motion: reduce) {
        #loading-page {
          transition: none;
        }
      }
    </style>
  </head>
  <body autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <!-- Vue app -->
    <div id="app"></div>

    <!-- Loading page on application startup -->
    <div id="loading-page">
      <div class="loading-stage">
        <img class="loading-logo" src="./assets/images/logo.png" alt="Vien logo">
        <div class="loading-wordmark">Vien</div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search)
      const THEME_SURFACES = {
        'one-dark': 'rgb(27, 29, 33)',
        'dark': 'rgb(24, 25, 29)',
        'graphite': 'rgb(34, 38, 42)',
        'material-dark': 'rgb(32, 29, 27)',
        'light': 'rgb(248, 244, 238)',
        'ulysses': 'rgb(244, 241, 235)'
      }
      const THEME_MARKS = {
        'one-dark': 'rgba(240, 234, 224, 0.72)',
        'dark': 'rgba(240, 234, 224, 0.72)',
        'graphite': 'rgba(240, 234, 224, 0.68)',
        'material-dark': 'rgba(244, 236, 225, 0.72)',
        'light': 'rgba(56, 48, 39, 0.62)',
        'ulysses': 'rgba(64, 54, 41, 0.62)'
      }

      const theme = params.get('theme')
      document.documentElement.style.setProperty('--loading-bg', THEME_SURFACES[theme] || 'rgb(248, 244, 238)')
      document.documentElement.style.setProperty('--loading-mark', THEME_MARKS[theme] || 'rgba(56, 48, 39, 0.62)')
    </script>

    <!-- Renderer entry point — Vite injects the bundled script here -->
    <script type="module" src="/main.js"></script>
  </body>
</html>
