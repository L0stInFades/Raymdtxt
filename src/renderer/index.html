<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Provide a minimal `process` global for Node.js polyfills (util, stream, etc.)
      // that run in the browser context. Electron's preload cannot expose `process`
      // because contextIsolation is enabled and nodeIntegration is off.
      if (typeof process === 'undefined') {
        window.process = { env: {}, browser: true, version: 'v22.0.0', versions: {}, platform: 'browser', nextTick: (fn) => { Promise.resolve().then(fn) } }
      } else if (!process.env) {
        process.env = {}
      }
    </script>
    <meta charset="utf-8">
    <link rel="icon" href="./assets/images/logo.png">
    <title>Vien</title>
    <style>
      :root {
        --loading-accent: rgba(33, 181, 111, 1);
        --loading-accent-soft: rgba(33, 181, 111, 0.18);
        --loading-text: rgba(22, 28, 45, 0.88);
        --loading-muted: rgba(22, 28, 45, 0.58);
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        overflow: hidden;
      }

      #loading-page {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, rgba(255, 255, 255, 0.96), rgba(245, 248, 252, 0.95) 42%, rgba(232, 237, 244, 0.92));
        -webkit-app-region: drag;
      }

      .loading-shell {
        position: relative;
        width: min(360px, calc(100vw - 48px));
        padding: 34px 28px 26px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(20px);
        text-align: center;
        overflow: hidden;
      }

      .loading-shell::before {
        content: '';
        position: absolute;
        inset: 1px;
        border-radius: 29px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.54), rgba(255, 255, 255, 0.12));
        pointer-events: none;
      }

      .loading-halo {
        position: absolute;
        width: 180px;
        height: 180px;
        left: 50%;
        top: -66px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(circle, var(--loading-accent-soft) 0%, rgba(255, 255, 255, 0) 72%);
        filter: blur(2px);
      }

      .loading-logo,
      .loading-brand,
      .loading-copy,
      .loading-progress {
        position: relative;
        z-index: 1;
      }

      .loading-logo {
        width: 96px;
        height: 96px;
        border-radius: 28px;
        box-shadow: 0 18px 44px rgba(63, 87, 173, 0.22);
      }

      .loading-brand {
        margin-top: 18px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--loading-text);
      }

      .loading-copy {
        margin: 10px auto 0;
        max-width: 240px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--loading-muted);
      }

      .loading-progress {
        margin: 22px auto 0;
        width: 160px;
        height: 4px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }

      .loading-progress::after {
        content: '';
        display: block;
        width: 55%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--loading-accent), rgba(73, 118, 206, 0.95));
        animation: loading-slide 1.8s ease-in-out infinite;
      }

      @keyframes loading-slide {
        0% {
          transform: translateX(-110%);
        }
        50% {
          transform: translateX(120%);
        }
        100% {
          transform: translateX(220%);
        }
      }

      @media (max-width: 420px) {
        .loading-shell {
          padding: 28px 22px 22px;
          border-radius: 24px;
        }

        .loading-brand {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <!-- Vue app -->
    <div id="app"></div>

    <!-- Loading page on application startup -->
    <div id="loading-page">
      <div class="loading-shell">
        <div class="loading-halo"></div>
        <img class="loading-logo" src="./assets/images/logo.png" alt="Vien logo">
        <div class="loading-brand">Vien</div>
        <div class="loading-copy">A quiet page is opening.</div>
        <div class="loading-progress"></div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search)
      const THEMES_COLOR = {
        'one-dark': 'rgba(77, 120, 204, 1)',
        'dark': '#409eff',
        'graphite': 'rgb(104, 134, 170)',
        'material-dark': '#f48237',
        'light': 'rgba(33, 181, 111, 1)',
        'ulysses': 'rgb(12, 139, 186)'
      }

      const hexToRgba = (hex, alpha) => {
        const normalized = hex.replace('#', '')
        if (normalized.length !== 6) return hex

        const r = Number.parseInt(normalized.slice(0, 2), 16)
        const g = Number.parseInt(normalized.slice(2, 4), 16)
        const b = Number.parseInt(normalized.slice(4, 6), 16)
        return `rgba(${r}, ${g}, ${b}, ${alpha})`
      }

      const toSoftColor = (value) => {
        if (value.startsWith('rgba(')) {
          return value.replace(/rgba\((.+),\s*[^,]+\)$/, 'rgba($1, 0.18)')
        }
        if (value.startsWith('rgb(')) {
          return value.replace(/rgb\((.+)\)$/, 'rgba($1, 0.18)')
        }
        if (value.startsWith('#')) {
          return hexToRgba(value, 0.18)
        }
        return value
      }

      const accent = THEMES_COLOR[params.get('theme')] || 'rgba(33, 181, 111, 1)'
      document.documentElement.style.setProperty('--loading-accent', accent)
      document.documentElement.style.setProperty('--loading-accent-soft', toSoftColor(accent))
    </script>

    <!-- Renderer entry point — Vite injects the bundled script here -->
    <script type="module" src="/main.js"></script>
  </body>
</html>
